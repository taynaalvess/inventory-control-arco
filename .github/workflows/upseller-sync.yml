name: UpSeller sync

on:
  schedule:
    - cron: '*/30 * * * *' # a cada 30 minutos (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulação (não grava nada)'
        type: boolean
        default: false

concurrency:
  group: upseller-sync
  cancel-in-progress: false

jobs:
  sync:
    # só roda depois que você criar a variável UPSELLER_SYNC_ENABLED = true
    if: vars.UPSELLER_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/upseller-sync.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSELLER_API_TOKEN: ${{ secrets.UPSELLER_API_TOKEN }}
          UPSELLER_CLIENT_ID: ${{ secrets.UPSELLER_CLIENT_ID }}
          UPSELLER_BASE_URL: ${{ vars.UPSELLER_BASE_URL }}
          UPSELLER_EP_INVENTORY: ${{ vars.UPSELLER_EP_INVENTORY }}
          UPSELLER_EP_ORDERS: ${{ vars.UPSELLER_EP_ORDERS }}
          UPSELLER_WAREHOUSE_ID: ${{ vars.UPSELLER_WAREHOUSE_ID }}
          UPSELLER_TOKEN_HEADER: ${{ vars.UPSELLER_TOKEN_HEADER }}
          UPSELLER_CLIENT_HEADER: ${{ vars.UPSELLER_CLIENT_HEADER }}
          UPSELLER_LOOKBACK_HOURS: ${{ vars.UPSELLER_LOOKBACK_HOURS }}
          DRY_RUN: ${{ inputs.dry_run }}
